name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # Build/test on the latest stable Go, the same toolchain the govulncheck job scans
          # with (see there). go.mod still declares the 1.25.11 *minimum* for users.
          go-version: 'stable'
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "::error::unformatted files:"; echo "$out"; exit 1; fi

      - name: Test (race)
        run: go test -race -count=1 ./...

      - name: JS syntax check
        run: node --check cmd/am/web/app.js

  # Separate job so a newly published advisory (or a vuln.go.dev outage) shows up as its own
  # failing check instead of failing build/vet/test on unchanged code. govulncheck is pinned so a
  # tool release cannot change the verdict; the advisory DB is still fetched live.
  govulncheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # stable, not go.mod's minimum: stdlib advisories are reported against this toolchain.
          go-version: 'stable'
          cache: true

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          govulncheck ./...

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Build/test on the latest stable Go (the toolchain the govulncheck job scans with) AND on
    # go.mod's declared minimum, so code needing a newer Go than users are promised fails here.
    strategy:
      fail-fast: false
      matrix:
        include:
          - go-version: 'stable'
          - go-version-file: 'go.mod'
    env:
      # Never let `go` silently download a newer toolchain: that would hide a too-new API.
      GOTOOLCHAIN: local

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          go-version-file: ${{ matrix.go-version-file }}
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "::error::unformatted files:"; echo "$out"; exit 1; fi

      - name: Test (race)
        run: go test -race -count=1 ./...

      - name: JS syntax check
        run: node --check cmd/am/web/app.js

  # Separate job so a newly published advisory (or a vuln.go.dev outage) shows up as its own
  # failing check instead of failing build/vet/test on unchanged code. govulncheck is pinned so a
  # tool release cannot change the verdict; the advisory DB is still fetched live.
  govulncheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # stable, not go.mod's minimum: stdlib advisories are reported against this toolchain.
          go-version: 'stable'
          cache: true

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          govulncheck ./...
